name: Windows build
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'amr-vcpkg'
          git clone https://github.com/microsoft/vcpkg $root
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          git -C $root checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          if ($LASTEXITCODE -ne 0) { throw 'Checkout failed' }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'Bootstrap failed' }
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
      - name: Build from source
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Verify and package
        shell: pwsh
        run: |
          python ./scripts/Package.py
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AMR-1.5.4-GitHubBuild
          path: dist/*
          if-no-files-found: error
