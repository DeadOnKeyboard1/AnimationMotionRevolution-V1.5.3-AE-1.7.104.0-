[Debug]
; Motion diagnosis: 0 = disabled (default), 1 = enabled.
; Requires the INI-capable AMR DLL and a full Skyrim restart after changing.
; Output: AnimationMotionRevolution.log in the game's SKSE log directory.
; At most 64 sampled motion records per category per game session.
bEnableMotionDiagnostics=0

; Normal logging: 0 trace, 1 debug, 2 info, 3 warning, 4 error, 5 critical, 6 off.
; Enabled motion diagnosis requests at least info without reducing debug/trace.
uLogLevel=4
